[package]
name = "macpane"
description = "MacPane: a LAN-only viewer for macOS Screen Sharing, built for Windows"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
default-run = "macpane"

[[bin]]
name = "macpane"
path = "src/main.rs"

[dependencies]
macpane-rfb = { path = "../macpane-rfb" }
macpane-discovery = { path = "../macpane-discovery" }
log.workspace = true
env_logger = "0.11"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.31"
